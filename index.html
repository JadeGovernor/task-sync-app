<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>效率任务 · 三端同步</title>
  <meta name="description" content="今日聚合 + 公司/计划/自律/习惯/琐事/效率，Mac + iPhone 三端同步" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest?v=51" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=51" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✓</span>
      <div>
        <h1>效率任务</h1>
        <p id="subline" class="subline">未连接</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-new" class="btn btn-primary btn-sm" type="button">＋ 新建任务</button>
      <button id="btn-sync" class="icon-btn" type="button" title="立即同步">⟳</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="模块切换"></nav>

  <main id="view" class="view"></main>

  <!-- 新建/编辑条目弹窗 -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form id="task-form" class="modal">
      <h2 id="modal-title">新建</h2>
      <label class="field">
        <span>标题</span>
        <input id="f-title" type="text" required maxlength="120" placeholder="写点什么…" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>类型</span>
          <select id="f-kind"></select>
        </label>
        <label class="field fg-work">
          <span>到期日（今日/明日/更晚）</span>
          <input id="f-due" type="date" />
        </label>
      </div>
      <div class="field-row fg-plan">
        <label class="field">
          <span>开始（可选）</span>
          <input id="f-range-start" type="date" />
        </label>
        <label class="field">
          <span>结束（可选，最后 10 天自动置顶“紧急”）</span>
          <input id="f-range-end" type="date" />
        </label>
      </div>
      <div class="field fg-habit">
        <label>
          <span>习惯频率</span>
          <select id="f-freq"></select>
        </label>
      </div>
      <div class="field fg-loop">
        <span>每周哪几天（可多选；到那天自动出现在「今日」最上面）</span>
        <div class="wd-picker" id="f-weekdays"></div>
      </div>
      <div class="field">
        <label>
          <span id="f-note-label">首条备注（可选）</span>
          <input id="f-note" type="text" maxlength="300" placeholder="可选" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="btn-delete-task" class="btn btn-danger hidden" type="button">删除</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-close="1">取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </div>

  <!-- 记一笔：给大条目补进展备注 -->
  <div id="note-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <form id="note-form" class="modal">
      <h2 id="note-title">补一条进展</h2>
      <label class="field">
        <span>今天这条目有了什么进展？</span>
        <textarea id="note-text" rows="3" maxlength="600" placeholder="像写日志一样，自由补充…"></textarea>
      </label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button class="btn" type="button" data-note-close="1">取消</button>
        <button class="btn btn-primary" type="submit">记下</button>
      </div>
    </form>
  </div>

  <!-- 通用确认弹窗 -->
  <div id="confirm-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal modal-sm">
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn" type="button">取消</button>
        <button id="confirm-ok" class="btn btn-danger" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- 流程图：左侧椭圆节点，画布内可拖动节点、拉箭头连接 -->
  <div id="flow-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="flow-title">
    <div class="modal flow-modal">
      <div class="flow-modal-head">
        <div>
          <h2 id="flow-title">流程图</h2>
          <p class="hint">点左侧椭圆添加节点；在椭圆边缘按住拖到另一个椭圆即可连线。</p>
        </div>
        <button class="flow-close" type="button" data-flow-close="1" aria-label="关闭流程图">✕</button>
      </div>
      <div class="flow-body">
        <aside class="flow-palette" aria-label="流程图工具">
          <span class="flow-palette-label">形状</span>
          <button class="flow-add-node" type="button" data-flow-add="1" title="添加一个椭圆节点">
            <span class="flow-add-oval">椭圆</span>
          </button>
          <p class="flow-palette-hint">节点可拖动；右侧圆点或椭圆边缘都能拉箭头。</p>
          <button id="flow-delete-node" class="btn btn-sm btn-danger" type="button" disabled>删除选中</button>
        </aside>
        <div id="flow-canvas-wrap" class="flow-canvas-wrap">
          <div id="flow-canvas" class="flow-canvas">
            <svg id="flow-svg" class="flow-svg" viewBox="0 0 900 560" aria-hidden="true">
              <defs>
                <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"></path>
                </marker>
                <marker id="flow-arrow-temp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"></path>
                </marker>
              </defs>
              <g id="flow-edge-layer"></g>
              <path id="flow-temp-edge" class="flow-temp-edge hidden"></path>
            </svg>
            <div id="flow-node-layer" class="flow-node-layer"></div>
            <div id="flow-empty" class="flow-empty">点左侧“椭圆”开始</div>
          </div>
        </div>
      </div>
      <div class="flow-modal-actions">
        <span id="flow-hint" class="hint">箭头从一个椭圆拖到另一个椭圆上松手。</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-flow-close="1">取消</button>
        <button id="flow-save" class="btn btn-primary" type="button">保存到白纸</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="fmt-bubble" class="fmt-bubble hidden" aria-hidden="true">
    <button class="fmt-trigger" type="button" title="文字格式" aria-label="文字格式">＋</button>
    <div class="fmt-options" role="menu" aria-label="快捷文字格式">
      <button type="button" data-fmt-preset="large" title="大：标题字号，加粗">大</button>
      <button type="button" data-fmt-preset="medium" title="中：小标题字号，加粗">中</button>
      <button type="button" data-fmt-preset="small" title="小：默认字号，不加粗">小</button>
      <button type="button" data-fmt-preset="bold" title="B：只加粗，字号不变"><b>B</b></button>
    </div>
  </div>

  <script src="./js/config.js?v=51"></script>
  <script src="./js/core.js?v=51"></script>
  <script src="./js/store.js?v=51"></script>
  <script src="./js/app.js?v=51"></script>
</body>
</html>
